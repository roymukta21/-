<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কদম ফুল</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100%;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const x = cv.getContext('2d');
const R = (a, b) => a + Math.random() * (b - a);
const cl = v => Math.max(0, Math.min(1, v));
const ease = v => (v = cl(v)) * v * (3 - 2 * v);
const mix = (a, b, u) =>
  a.map((v, i) => v + (b[i] - v) * u);
const rgb = (c, k = 1) => `rgb(${c.map(v => v * k | 0)})`;
const N = 650;
const LV = [[.05, .15, .5], [.95, .12, -.6],
  [0, .55, -.3], [1, .6, .4],
  [.1, .95, -.7], [.9, .95, .7]];
let W, H, pts, drops, last = 0;

function init() {
  W = cv.width = cv.clientWidth;
  H = cv.height = cv.clientHeight;
  pts = Array.from({length: N}, (_, i) => {
    const y = 1 - 2 * (i + .5) / N;
    const r = Math.sqrt(1 - y * y);
    const a = i * 2.39996;
    return {x: Math.cos(a) * r, y, z: Math.sin(a) * r,
      h: R(.7, 1.2)};
  });
  drops = Array.from({length: 140}, () => ({
    x: R(0, W), y: R(0, H), v: R(18, 32), l: R(30, 70)
  }));
}

function backdrop(t, cx, cy) {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b2a2a');
  g.addColorStop(1, '#123d33');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
  LV.forEach(([lx, ly, a0], i) => {
    const a = a0 + Math.sin(t + i) * .04;
    const lg = x.createLinearGradient(-230, 0, 230, 0);
    lg.addColorStop(0, '#0f4a30');
    lg.addColorStop(1, '#2f7a45');
    x.save();
    x.translate(W * lx, H * ly);
    x.rotate(a);
    x.fillStyle = lg;
    x.beginPath();
    x.ellipse(0, 0, 230, 95, 0, 0, 6.3);
    x.fill();
    x.strokeStyle = 'rgba(160,230,160,.3)';
    x.beginPath();
    x.moveTo(-220, 0);
    x.lineTo(220, 0);
    x.stroke();
    x.restore();
  });
}

function florets(list, col, tip) {
  x.strokeStyle = col;
  x.lineWidth = 2.2;
  x.beginPath();
  list.forEach(p => {
    x.moveTo(p.sx, p.sy);
    x.lineTo(p.ex, p.ey);
  });
  x.stroke();
  x.fillStyle = tip;
  x.beginPath();
  list.forEach(p => {
    x.moveTo(p.ex + 3.5, p.ey);
    x.arc(p.ex, p.ey, 3.5, 0, 6.3);
  });
  x.fill();
}

function ball(u, t, cx, cy) {
  const g = ease(u / .4), f = ease((u - .3) / .5);
  const r = 40 + 130 * g, len = 40 * f * r / 170;
  const a = t * .5, ca = Math.cos(a), sa = Math.sin(a);
  const c = mix([120, 170, 60], [255, 175, 30], f);
  const L = [[], [], []];
  pts.forEach(p => {
    const X = p.x * ca + p.z * sa;
    const Z = -p.x * sa + p.z * ca;
    const e = r + len * p.h;
    L[Z < 0 ? 0 : Z < .6 ? 1 : 2].push({
      sx: cx + X * r, sy: cy + p.y * r,
      ex: cx + X * e, ey: cy + p.y * e
    });
  });
  const tip = rgb(mix([190, 225, 110], [255, 235, 150], f));
  florets(L[0], rgb(c, .55), rgb(c, .8));
  x.fillStyle = rgb(c, .75);
  x.beginPath();
  x.arc(cx, cy, r * .97, 0, 6.3);
  x.fill();
  florets(L[1], rgb(c, .85), tip);
  florets(L[2], rgb(c, 1), tip);
}

function rain(k) {
  x.strokeStyle = 'rgba(200,230,255,.35)';
  x.lineWidth = 2;
  x.beginPath();
  drops.forEach(d => {
    d.y += d.v * k;
    d.x -= d.v * k * .15;
    if (d.y > H + 60) { d.y = -60; d.x = R(0, W + 100); }
    x.moveTo(d.x, d.y);
    x.lineTo(d.x + d.l * .15, d.y - d.l);
  });
  x.stroke();
}

function frame(ms) {
  const t = ms / 1000, u = Math.min(t / 13, 1);
  const k = Math.min(t - last, .05) * 60;
  last = t;
  const cx = W * .5 + Math.sin(t * .9) * 12, cy = H * .45;
  backdrop(t, W * .5, cy);
  x.strokeStyle = '#3d4a2a';
  x.lineWidth = 10;
  x.beginPath();
  x.moveTo(cx, 0);
  x.lineTo(cx, cy - 40);
  x.stroke();
  ball(u, t, cx, cy);
  rain(k);
  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);
</script>
</body>
</html>
